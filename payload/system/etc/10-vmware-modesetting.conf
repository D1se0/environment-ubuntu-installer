# whitehatSO: modesetting (KMS/RandR -> VMware auto-resize works)
# AccelMethod none: disables glamor/3D submission that wedges vmwgfx
# fences when the VM has no accelerated 3D graphics.
Section "Device"
    Identifier "VMware SVGA (modesetting)"
    Driver     "modesetting"
    Option     "AccelMethod" "none"
EndSection
