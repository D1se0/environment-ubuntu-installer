foreground               #cfcfcf
cursor                   #e0303c
cursor_text_color        #0d0d0d
selection_background     #e0303c
selection_foreground     #0d0d0d
url_color                #9a9a9a

background_opacity      0.92
dynamic_background_opacity yes

active_border_color      #e0303c
inactive_border_color    #3a3a3d

color0  #000000
color8  #3a3a3d
color1  #ff3b3b
color9  #ff3b3b
color2  #9a9a9a
color10 #9a9a9a
color3  #e0303c
