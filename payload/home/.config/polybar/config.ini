[colors]
background = #0d0d0d
background-alt = #1b1b1d
foreground = #cfcfcf
accent = #e0303c
accent2 = #9a9a9a
alert = #ff3b3b
grey = #3a3a3d

[bar/whitehatso]
width = 100%
height = 30
background = ${colors.background}
foreground = ${colors.foreground}
font-0 = JetBrainsMono Nerd Font:size=10;2
font-1 = JetBrainsMono Nerd Font:size=12;3
modules-left = powermenu bspwm separator-l
modules-center = date
modules-right = attacker-ip htb-vpn separator-r network volume memory cpu
border-size = 2
border-color = ${colors.background-alt}
padding-left = 1
padding-right = 1
module-margin = 1

[module/powermenu]
type = custom/text
format = ""
format-foreground = ${colors.accent}
format-padding = 2
click-left = ~/.config/polybar/scripts/power_menu.sh

[module/bspwm]
type = internal/bspwm
label-focused =  %index%
label-focused-background = ${colors.background-alt}
label-focused-foreground = ${colors.accent}
label-focused-padding = 2
label-occupied = %index%
label-occupied-padding = 2
label-urgent =  %index%
label-urgent-foreground = ${colors.alert}
label-urgent-padding = 2
label-empty = %index%
label-empty-foreground = ${colors.grey}
label-empty-padding = 2

[module/separator-l]
type = custom/text
format = "│"
format-foreground = ${colors.grey}

[module/separator-r]
type = custom/text
format = "│"
format-foreground = ${colors.grey}

[module/date]
type = internal/date
interval = 1
date =  %Y-%m-%d
time = %H:%M:%S
label = %date%  %time%
label-foreground = ${colors.accent2}

[module/cpu]
type = internal/cpu
interval = 2
label =  %percentage%%
label-foreground = ${colors.accent}

[module/memory]
type = internal/memory
interval = 2
label =  %percentage_used%%
label-foreground = ${colors.accent}

[module/network]
type = internal/network
interface-type = wired
interval = 3
label-connected =  %local_ip%
label-connected-foreground = ${colors.foreground}
label-disconnected =  sin red
label-disconnected-foreground = ${colors.grey}

[module/volume]
type = internal/pulseaudio
label-volume =  %percentage%%
label-volume-foreground = ${colors.foreground}
label-muted =  mute
label-muted-foreground = ${colors.grey}

[module/attacker-ip]
type = custom/script
exec = ~/.config/polybar/scripts/attacker_ip.sh
interval = 3
click-left = ~/.config/polybar/scripts/set_attacker_ip.sh
label-foreground = ${colors.accent}

[module/htb-vpn]
type = custom/script
exec = ~/.config/polybar/scripts/htb_vpn_ip.sh
interval = 3
label-foreground = ${colors.accent2}
