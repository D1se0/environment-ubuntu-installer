window_padding_width     10
confirm_os_window_close  0
tab_bar_style            powerline
tab_powerline_style      slanted
active_tab_background    #e0303c
active_tab_foreground    #0d0d0d
inactive_tab_background  #1b1b1d
inactive_tab_foreground  #9a9a9a

# >>> whitehatSO ctrl >>>
# Ctrl+W / Super+W: cerrar ventana con confirmacion Si/No (mismo dialogo que en
# el resto del SO). Sin esto, kitty se come la tecla (protocolo de teclado de
# kitty) y muestra codigos tipo 9;9u. super+w tambien: en VMware con teclado
# espanol la pulsacion fisica de Ctrl+W puede llegar como Super+W.
map ctrl+w launch --type=background /usr/local/bin/whitehatso-close
map super+w launch --type=background /usr/local/bin/whitehatso-close
# <<< whitehatSO ctrl <<<
