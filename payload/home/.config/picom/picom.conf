backend = "xrender";
vsync = false;
use-damage = true;
unredir-if-possible = true;

# Sombras y fundidos apagados a propósito: en una VM sin GPU real (render por
# software) son el coste más caro de cada redibujado y es lo que más se nota
# como "tirones" al mover/cambiar de ventana. Bordes redondeados sí, son baratos.
shadow = false;
fading = false;

corner-radius = 6;
round-borders = 1;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;

wintypes: {
  tooltip = { fade = false; shadow = false; };
  dock = { shadow = false; };
  popup_menu = { opacity = 0.95; };
  dropdown_menu = { opacity = 0.95; };
};
